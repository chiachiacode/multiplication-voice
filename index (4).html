<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>九九乘法｜連續收音逐格填空</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC",sans-serif;background:#f5f7fb;color:#152238}*{box-sizing:border-box}body{margin:0;padding:18px}.app{max-width:700px;margin:auto}.card{background:white;border:1px solid #e2e8f0;border-radius:19px;padding:20px;margin:12px 0;box-shadow:0 6px 22px #15223808}h1{font-size:24px;margin:0 0 8px}p{line-height:1.65;color:#526078}.fields{display:flex;gap:12px;flex-wrap:wrap}.fields label{flex:1;min-width:115px;font-weight:600;font-size:14px}.fields input,.fields select{width:100%;border:1px solid #c7d3e1;border-radius:10px;padding:11px;margin-top:6px;font:inherit;background:white}.toolbar{display:flex;gap:9px;flex-wrap:wrap;margin-top:14px}button{font:inherit;padding:11px 16px;border:1px solid #c5d0db;border-radius:12px;background:white;cursor:pointer}button.primary{background:#146bca;color:white;border-color:#146bca}button.red{background:#b83232;color:white;border-color:#b83232}button:disabled{opacity:.45;cursor:default}.status{background:#e9f2ff;color:#114c8b;border-radius:12px;padding:11px 13px;margin-top:13px}.status.err{background:#ffeded;color:#922}.grid{display:grid;gap:10px;margin:14px 0}.equation{display:grid;grid-template-columns:24px minmax(0,1fr) 20px minmax(0,1fr) 20px minmax(0,1fr);align-items:center;gap:6px;text-align:center}.cell{border:2px solid #d7e0e9;border-radius:11px;min-height:47px;display:flex;align-items:center;justify-content:center;font-size:23px;font-weight:700;background:#fcfdff}.cell.active{border-color:#1976d2;box-shadow:0 0 0 3px #1976d22b;background:#eaf4ff}.cell.filled{background:#ecf9f1;border-color:#91cfa7}.cell.bad{background:#ffe8e8;border-color:#d98282}.sign{font-size:19px;color:#6c7a90}.num{color:#8895aa;font-size:12px}.meter{height:9px;background:#e9eef4;border-radius:30px;overflow:hidden}.meter>div{height:100%;background:#168467;width:0%;transition:width .2s}.info{font-size:14px;color:#65758c}.preview{min-height:24px;word-break:break-all;color:#5d6f81}.hint{font-size:13px}.scores{font-weight:700;font-size:20px}.hidden{display:none}kbd{background:#eef1f5;padding:2px 6px;border-radius:4px}
</style></head><body><main class="app">
<section class="card"><h1>🎤 九九乘法語音闖關</h1><p>獨立收音，逐格填入完整算式；每次只說一個數字，略作停頓，不要一次說完整句。</p><div class="fields"><label>班級<input id="cls" maxlength="20" placeholder="例如 G2A" autocomplete="off"></label><label>座號<input id="seat" type="number" min="1" max="60" placeholder="例如 12"></label><label>乘法任務<select id="table"></select></label></div><div class="toolbar"><button class="primary" id="start">🎤 開始收音</button><button class="red" id="stop" disabled>停止</button><button id="undo">退回一格</button><button id="reset">重新開始</button></div><div id="status" class="status" role="status">尚未開始。請使用 HTTPS 網址，並允許麥克風存取。</div><div class="info" id="heard">等待語音辨識…</div></section>
<section class="card"><div style="display:flex;justify-content:space-between;align-items:center;gap:8px"><strong>完整算式填空</strong><strong id="progress">0 / 27</strong></div><div class="meter"><div id="bar"></div></div><div class="grid" id="grid"></div><p class="hint">一格只收一個整數：說「二」填 2；說「十」填 10。若系統同時聽到多個數字或句子，會要求重說，不會擅自切分。</p></section>
<section class="card"><strong>辨識與驗收</strong><p class="preview" id="last">尚無結果</p><div class="toolbar"><button id="manual">手動補填目前格</button><button id="grade" class="primary">批改</button><button id="save">儲存至 GAS</button><button id="csv">匯出 CSV</button></div><p id="score" class="scores"></p><p class="hint">重要：瀏覽器的連續辨識不等於保證無限不中斷。iPad Safari 可能自行結束一段辨識，頁面會嘗試重新啟動；若瀏覽器阻止重啟，請再按「開始收音」。</p></section>
</main><script>
'use strict';
// 請改為 GAS 網頁應用程式 /exec 網址；留空時仍可離線練習與 CSV 匯出。
const GAS_WEB_APP_URL = '';
const $=id=>document.getElementById(id);
const Recognition=window.SpeechRecognition||window.webkitSpeechRecognition;
let rec=null, wanted=false, restarting=false, values=Array(27).fill(null), pos=0, lastAccepted='', lastAcceptedAt=0;
for(let n=2;n<=9;n++)$('table').add(new Option(`${n} 的乘法`,n));
function status(s,error=false){$('status').textContent=s;$('status').className='status'+(error?' err':'')}
function render(){const grid=$('grid');grid.innerHTML='';for(let i=0;i<9;i++){const row=document.createElement('div');row.className='equation';const num=document.createElement('span');num.className='num';num.textContent=String(i+1)+'.';row.append(num);for(let j=0;j<3;j++){const k=3*i+j,cell=document.createElement('div');cell.className='cell'+(values[k]!==null?' filled':'')+(k===pos?' active':'');cell.textContent=values[k]===null?'?':String(values[k]);cell.id=`cell${k}`;row.append(cell);if(j<2){const sign=document.createElement('span');sign.className='sign';sign.textContent=j===0?'×':'=';row.append(sign)}}grid.append(row)}$('progress').textContent=values.filter(v=>v!==null).length+' / 27';$('bar').style.width=(values.filter(v=>v!==null).length/27*100)+'%';$('save').disabled=values.some(v=>v===null)}
// 單一數字辨識：不解析整串口訣，不從標準乘法答案推斷。
function parseOneNumber(raw){let s=String(raw).normalize('NFKC').trim().replace(/[\s，。！？、,.!?:：；;]+/g,'');s=s.replace(/^(?:答案是|等於|是|得)/,'');s=s.replace(/(?:喔|哦|呀|啊)$/,'');if(/^\d{1,2}$/.test(s))return Number(s);const d={'零':0,'〇':0,'一':1,'二':2,'兩':2,'三':3,'四':4,'五':5,'六':6,'七':7,'八':8,'九':9};if(Object.hasOwn(d,s))return d[s];if(s==='十'||s==='拾'||s==='一十')return 10;let m=s.match(/^(?:(一|二|兩|三|四|五|六|七|八|九))?十([一二兩三四五六七八九])?$/);if(m){const tens=m[1]?d[m[1]]:1,units=m[2]?d[m[2]]:0;return tens*10+units}return null}
function put(n,raw){if(pos>=27)return;values[pos]=n;lastAccepted=String(raw);lastAcceptedAt=Date.now();$('last').textContent=`收到：「${raw}」→ ${n}，已填入第 ${pos+1} 格`;pos++;render();if(pos===27){stop();status('27 格完成！請按「批改」查看結果。')}}
function onUtterance(text){const n=parseOneNumber(text);if(n===null||n<0||n>99){$('last').textContent=`未填入：「${text}」；請一次只說一個數字`;return}put(n,text)}
function setupRecognition(){if(!Recognition){status('此瀏覽器沒有提供 SpeechRecognition。請改用支援的瀏覽器，或使用手動輸入。',true);return false}rec=new Recognition();rec.lang='zh-TW';rec.continuous=true;rec.interimResults=true;rec.maxAlternatives=1;rec.onresult=e=>{let interim='';for(let i=e.resultIndex;i<e.results.length;i++){const t=e.results[i][0].transcript;if(e.results[i].isFinal){onUtterance(t)}else interim=t}if(interim)$('heard').textContent='聽到（尚未確認）：'+interim};rec.onerror=e=>{status(`辨識錯誤：${e.error}`+(e.error==='not-allowed'?'。請確認麥克風授權':''),true);if(['not-allowed','service-not-allowed','audio-capture'].includes(e.error))wanted=false};rec.onend=()=>{restarting=false;if(wanted&&pos<27){status('辨識階段已結束，正在嘗試接續收音…');setTimeout(()=>{if(wanted&&rec&&!restarting){try{restarting=true;rec.start()}catch(err){restarting=false;wanted=false;status('無法自動重啟；請再次按「開始收音」。',true)}}},400)}else{ $('start').disabled=false;$('stop').disabled=true}};return true}
function start(){if(pos===27){status('已完成 27 格；需要重新開始才能再填。');return}if(!rec&&!setupRecognition())return;wanted=true;$('start').disabled=true;$('stop').disabled=false;try{rec.start();status('正在聽…每次說一個數字，略作停頓。')}catch(e){if(e.name!=='InvalidStateError'){wanted=false;status('無法開始：'+e.message,true);$('start').disabled=false;$('stop').disabled=true}}}
function stop(){wanted=false;restarting=false;if(rec){try{rec.stop()}catch(e){}}$('start').disabled=false;$('stop').disabled=true;if(pos<27)status('已停止收音')}
$('start').onclick=start;$('stop').onclick=stop;
$('undo').onclick=()=>{if(pos<=0)return;pos--;values[pos]=null;render();status('已返回第 '+(pos+1)+' 格，可以繼續說。')};
$('reset').onclick=()=>{stop();values=Array(27).fill(null);pos=0;$('score').textContent='';$('last').textContent='尚無結果';render()};
$('manual').onclick=()=>{const raw=prompt('輸入目前格的單一數字（0～99）：');if(raw!==null)onUtterance(raw)};
$('table').onchange=()=>{stop();values=Array(27).fill(null);pos=0;$('score').textContent='';render()};
function grade(){const t=Number($('table').value);let correct=0;const rows=[];for(let i=0;i<9;i++){const got=values.slice(i*3,i*3+3),want=[t,i+1,t*(i+1)];const pass=got.every((v,j)=>v!==null&&v===want[j]);if(pass)correct++;rows.push({題號:i+1,學生:got.join('×,='),正確答案:want.join('×,='),結果:pass?'正確':'錯誤或未完成'})} $('score').textContent=`答對 ${correct} / 9 題；已填 ${values.filter(x=>x!==null).length} / 27 格`;return {correct,rows}}
$('grade').onclick=grade;
function makeId(){return 'voice'+Date.now().toString(36)+Math.random().toString(36).slice(2,12)}
// 以表單 POST 避免跨網域 JSON fetch 的 CORS 限制。成功回報以伺服器回傳訊息為準。
$('save').onclick=()=>{if(!GAS_WEB_APP_URL){status('尚未設定 GAS_WEB_APP_URL。可以先匯出 CSV。',true);return}const cls=$('cls').value.trim().toUpperCase(),seat=Number($('seat').value);if(!/^[A-Z0-9_-]{1,20}$/.test(cls)||!Number.isInteger(seat)||seat<1||seat>60){status('請輸入正確班級及座號。',true);return}if(values.some(x=>x===null)){status('請先填滿 27 格。',true);return}const nonce=makeId(),payload={className:cls,seat,table:Number($('table').value),values,attemptId:nonce};const frame=document.createElement('iframe');frame.style.display='none';frame.name='submit_'+nonce;document.body.append(frame);const form=document.createElement('form');form.method='POST';form.action=GAS_WEB_APP_URL;form.target=frame.name;form.style.display='none';const input=document.createElement('input');input.name='payload';input.value=JSON.stringify(payload);form.append(input);document.body.append(form);form.submit();form.remove();status('已送出儲存要求。請在 Google Sheets 確認是否寫入；此版本不將跨網域表單送出視為已成功。');setTimeout(()=>frame.remove(),30000)};
$('csv').onclick=()=>{const score=grade();const lines=[['班級','座號','乘法任務','時間','答對題數',...Array.from({length:27},(_,i)=>`格${i+1}`)],[$('cls').value,$('seat').value,$('table').value,new Date().toLocaleString('zh-TW'),score.correct,...values]].map(row=>row.map(s=>'"'+String(s??'').replaceAll('"','""')+'"').join(','));const blob=new Blob(['\ufeff'+lines.map(r=>r.join?r.join(','):r).join('\r\n')],{type:'text/csv;charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='九九乘法逐格紀錄.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};
render();if(!Recognition)status('目前瀏覽器不支援 Web Speech Recognition，仍可使用手動測試。',true);
</script></body></html>
